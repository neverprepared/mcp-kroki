name: release

# Homebrew-only distribution. Compiles the TypeScript MCP server to a single
# self-contained binary with `bun build --compile`, ships it as a GitHub release
# asset, and renders Formula/mcp-kroki.rb into neverprepared/homebrew-tap.
# No npm publish — mcp-kroki is installed via `brew install neverprepared/tap/mcp-kroki`.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14 # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        # Not --frozen-lockfile: the repo ships package-lock.json (npm is used for
        # dev/tests); bun migrates it on install, which trips the frozen check.
        run: bun install

      - name: Compile binaries (darwin + linux)
        # darwin/arm64 → Homebrew; linux/arm64+amd64 → the mcp-gateway container
        # image bakes these (mcp-kroki isn't on npm, so the gateway can't npx it).
        run: |
          build() { mkdir -p build && bun build --compile --target="$1" ./src/index.ts --outfile build/mcp-kroki && tar -czf "$2" -C build mcp-kroki && rm -rf build; }
          build bun-darwin-arm64 mcp-kroki_darwin_arm64.tar.gz
          build bun-linux-arm64  mcp-kroki_linux_arm64.tar.gz
          build bun-linux-x64    mcp-kroki_linux_amd64.tar.gz

      - name: Resolve version + checksum
        id: meta
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 mcp-kroki_darwin_arm64.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          assets="mcp-kroki_darwin_arm64.tar.gz mcp-kroki_linux_arm64.tar.gz mcp-kroki_linux_amd64.tar.gz"
          gh release create "${GITHUB_REF_NAME}" $assets \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes || \
          gh release upload "${GITHUB_REF_NAME}" $assets \
            --repo "${GITHUB_REPOSITORY}" --clobber

      - name: Render + push Homebrew formula
        env:
          # Fine-grained PAT with contents:write on neverprepared/homebrew-tap,
          # stored as the HOMEBREW_TAP_TOKEN secret on this repo (same as mcp-slack).
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.meta.outputs.version }}
          SHA256: ${{ steps.meta.outputs.sha256 }}
        run: |
          set -euo pipefail
          if [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then
            echo "HOMEBREW_TAP_TOKEN not set — skipping formula push (add the secret to automate this)."
            exit 0
          fi
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/neverprepared/homebrew-tap.git" tap
          cat > tap/Formula/mcp-kroki.rb <<RUBY
          # typed: false
          # frozen_string_literal: true

          # Generated by neverprepared/mcp-kroki release workflow. Do not edit by hand.
          class McpKroki < Formula
            desc "MCP server: diagram markup -> images via a Kroki instance"
            homepage "https://github.com/neverprepared/mcp-kroki"
            version "${VERSION}"
            license "MIT"
            depends_on :macos

            if Hardware::CPU.arm?
              url "https://github.com/neverprepared/mcp-kroki/releases/download/v${VERSION}/mcp-kroki_darwin_arm64.tar.gz"
              sha256 "${SHA256}"

              define_method(:install) do
                bin.install "mcp-kroki"
              end
            end

            def caveats
              <<~EOS
                Point KROKI_URL at a shared/central Kroki endpoint (recommended):
                  KROKI_URL=http://localhost:18000 mcp-kroki

                Configure your MCP host (e.g. Claude Code) to run:
                  mcp-kroki

                If KROKI_URL is unreachable, mcp-kroki falls back to starting a
                local Kroki Docker stack (project: kroki-shared) — requires Docker.
              EOS
            end
          end
          RUBY
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/mcp-kroki.rb
          git commit -m "mcp-kroki ${VERSION}" || { echo "no formula change"; exit 0; }
          git push
